<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>SDC Tools — Launcher</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      /* Brand (fixed across themes) */
      --blue:   #1574C4;
      --navy:   #061D39;
      --light:  #AACEE8;
      --yellow: #FFDE51;
      --green:  #74C415;
      --lime:   #BEFA4F;
      --gray:   #D9D9D9;
      --black:  #231F20;

      --w: 960px;
      --h: 680px;
    }

    /* ── DARK theme (default) ──────────────────────────────────────────── */
    .electron-window {
      /* Surface scale — exact SDC Dark Navy (#061D39) as the anchor */
      --bg-0:   #030d1c;        /* page bg — deepest level, under cards */
      --bg-1:   #061D39;        /* card bg — exact SDC Dark Navy */
      --bg-1h:  #0a2749;        /* card bg hover — slightly lifted navy */
      --bg-2:   #04122b;        /* banner bg */
      --header-bg: #040f22;     /* header — 1 level darker than cards */
      --header-fg: #FFFFFF;
      --header-sub: var(--light);
      --rule:   rgba(170, 206, 232, 0.07);
      --rule-2: rgba(170, 206, 232, 0.12);
      --hairline: rgba(21, 116, 196, 0.28);

      --fg:        #EAF2FB;
      --fg-muted:  #AACEE8;
      --fg-dim:    #5E7693;
      --fg-mono:   #7E97B6;

      --card-shadow-amt: 18%;
      --desktop-bg: radial-gradient(ellipse 1400px 900px at 15% -5%, #0d1f36 0%, #060e1a 50%, #020509 100%);
    }

    /* ── LIGHT theme ───────────────────────────────────────────────────── */
    .electron-window[data-theme="light"] {
      --bg-0:   #EEF4FB;        /* page bg — SDC light blue tint */
      --bg-1:   #FFFFFF;        /* card bg — clean white */
      --bg-1h:  #F5F9FE;        /* card bg hover */
      --bg-2:   #E8F0FA;        /* banner bg */
      --header-bg: var(--navy); /* header stays Dark Navy in light mode — brand requirement */
      --header-fg: #FFFFFF;
      --header-sub: var(--light);
      --rule:   rgba(6, 29, 57, 0.07);
      --rule-2: rgba(6, 29, 57, 0.11);
      --hairline: rgba(21, 116, 196, 0.25);

      --fg:        #061D39;
      --fg-muted:  #3D566E;
      --fg-dim:    #7A8FA3;
      --fg-mono:   #4D6880;

      --card-shadow-amt: 22%;
    }
    body[data-theme="light"] {
      --desktop-bg: radial-gradient(ellipse 1400px 900px at 15% -5%, #dce8f5 0%, #c8d8e8 50%, #b0c2d4 100%);
    }
    /* Light-theme chip & control fine-tuning */
    .electron-window[data-theme="light"] {
      --chip-bg:   rgba(21, 116, 196, 0.06);
      --chip-bg-h: rgba(21, 116, 196, 0.12);
      --chip-bd:   rgba(21, 116, 196, 0.18);
      --chip-bd-h: rgba(21, 116, 196, 0.35);
      --wc-fg:     rgba(255, 255, 255, 0.55);  /* header stays dark navy */
      --wc-hover:  rgba(255, 255, 255, 0.08);
    }
    .electron-window[data-theme="light"] .main {
      background:
        radial-gradient(700px 400px at 100% 0%, rgba(21,116,196,0.06), transparent 55%),
        var(--bg-0);
    }
    .electron-window[data-theme="light"] .pill-toggle.on {
      background: rgba(21,116,196,0.12);
      border-color: rgba(21,116,196,0.40);
      color: var(--blue);
    }
    .electron-window[data-theme="light"] .card {
      box-shadow:
        0 1px 0 rgba(255,255,255,0.9) inset,
        0 1px 4px rgba(6,29,57,0.06);
    }
    .electron-window[data-theme="light"] .card:hover {
      box-shadow:
        0 1px 0 rgba(255,255,255,0.9) inset,
        0 4px 16px color-mix(in oklch, var(--accent) 16%, transparent),
        0 1px 4px rgba(6,29,57,0.08);
    }
    .electron-window[data-theme="light"] .banner {
      background: var(--bg-2);
      border-color: rgba(21,116,196,0.25);
    }
    .electron-window[data-theme="light"] .statusbar {
      background: var(--navy);
      border-top-color: rgba(21,116,196,0.3);
    }
    .electron-window[data-theme="light"] .statusbar .sb-summary,
    .electron-window[data-theme="light"] .statusbar .sb-host {
      color: rgba(170,206,232,0.6);
    }
    /* Log panel keeps a dark surface in both themes — it's a console */
    .electron-window[data-theme="light"] .logpanel {
      background: rgba(7, 22, 41, 0.97);
      border-color: rgba(21,116,196,0.45);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      background: var(--desktop-bg, radial-gradient(1200px 800px at 10% 0%, #1a1f2e 0%, #0c1018 55%, #06080d 100%));
      color: var(--fg);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* The "desktop" — centers the Electron window with a faux taskbar feel */
    .desktop {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      padding: 32px;
      overflow: hidden;
    }
    /* Auto-scale wrapper — keeps the 960×680 window fixed-size, then fits to viewport */
    .stage {
      width: var(--w);
      height: var(--h);
      flex-shrink: 0;
      transform-origin: center center;
    }
    /* subtle grid texture so the window has a stage */
    .desktop::before {
      content: ''; position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
      background-size: 32px 32px;
      pointer-events: none;
    }

    /* ── Electron window ─────────────────────────────────────────────────── */
    .electron-window {
      position: relative;
      width: var(--w);
      height: var(--h);
      background: var(--bg-0);
      border-radius: 14px;
      overflow: hidden;
      display: grid;
      grid-template-rows: 56px 1fr 32px;
      box-shadow:
        0 0 0 1px rgba(21,116,196,0.18),
        0 1px 0 rgba(170,206,232,0.06) inset,
        0 24px 64px -16px rgba(0,0,0,0.75),
        0 48px 120px -24px rgba(0,0,0,0.65),
        0 0 0 4px rgba(6,29,57,0.4);
    }

    /* ── Header / title bar ──────────────────────────────────────────────── */
    .header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 0 0 18px;
      background: var(--header-bg);
      border-bottom: 1px solid var(--hairline);
      -webkit-app-region: drag;
      app-region: drag;
      height: 56px;
    }
    .header [data-nodrag],
    .header button {
      -webkit-app-region: no-drag;
      app-region: no-drag;
    }
    .header-left {
      display: flex; align-items: center; gap: 12px;
      height: 100%;
    }
    .wordmark {
      display: flex; flex-direction: column; gap: 1px;
      border-left: 1px solid var(--rule-2);
      padding-left: 12px;
      margin-left: 4px;
    }
    .wordmark-name {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.12em;
      color: var(--header-fg);
      line-height: 1;
    }
    .wordmark-sub {
      font-size: 9.5px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      font-style: italic;
      color: var(--header-sub);
      letter-spacing: 0.02em;
      margin-top: 3px;
      opacity: 0.75;
    }

    .header-right {
      display: flex; align-items: center; gap: 8px;
      padding-right: 0;
      height: 100%;
    }

    .version-badge {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10.5px;
      letter-spacing: 0.04em;
      color: var(--fg-dim);
      background: var(--chip-bg, rgba(170,206,232,0.06));
      border: 1px solid var(--chip-bd, rgba(170,206,232,0.10));
      padding: 3px 7px;
      border-radius: 4px;
    }

    .pill-toggle {
      display: inline-flex; align-items: center; gap: 7px;
      background: var(--chip-bg, rgba(170,206,232,0.04));
      border: 1px solid var(--chip-bd, rgba(170,206,232,0.10));
      color: var(--fg-muted);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: 0.04em;
      padding: 5px 9px 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease;
    }
    .pill-toggle .pill-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--fg-dim);
      box-shadow: none;
    }
    .pill-toggle.on {
      color: var(--header-fg);
      background: rgba(21,116,196,0.16);
      border-color: rgba(21,116,196,0.45);
    }
    .pill-toggle.on .pill-dot {
      background: var(--green);
      box-shadow: 0 0 6px rgba(116,196,21,0.7);
    }
    .pill-toggle:hover { background: var(--chip-bg-h, rgba(170,206,232,0.10)); }

    .header-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: transparent;
      border: 1px solid var(--chip-bd, rgba(170,206,232,0.10));
      color: var(--fg-muted);
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      letter-spacing: 0.04em;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 180ms ease, border-color 180ms ease, color 180ms ease;
    }
    .header-btn:hover { background: var(--chip-bg-h, rgba(170,206,232,0.08)); color: var(--header-fg); border-color: var(--chip-bd-h, rgba(170,206,232,0.25)); }
    .header-btn.icon-only { padding: 6px 7px; }
    .header-btn.danger:hover { color: #F25C5C; border-color: rgba(242,92,92,0.45); background: rgba(242,92,92,0.06); }
    .header-btn svg { display: block; }

    .win-controls {
      display: flex; align-items: center;
      height: 100%;
      margin-left: 6px;
    }
    .wc {
      width: 46px; height: 100%;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; border: 0;
      color: var(--wc-fg, rgba(255,255,255,0.55));
      cursor: pointer;
      transition: background 180ms ease, color 180ms ease;
    }
    .wc:hover { background: var(--wc-hover, rgba(255,255,255,0.06)); color: var(--header-fg); }
    .wc.close:hover { background: #C42B1C; color: #fff; }

    /* ── Main ────────────────────────────────────────────────────────────── */
    .main {
      padding: 20px 24px 24px;
      overflow: auto;
      background:
        radial-gradient(700px 400px at 100% 0%, rgba(21,116,196,0.07), transparent 55%),
        radial-gradient(500px 300px at 0% 100%, rgba(116,196,21,0.03), transparent 60%),
        var(--bg-0);
    }

    /* Scrollbar styling */
    .main::-webkit-scrollbar { width: 10px; }
    .main::-webkit-scrollbar-thumb { background: rgba(170,206,232,0.12); border-radius: 5px; }
    .main::-webkit-scrollbar-thumb:hover { background: rgba(170,206,232,0.2); }

    /* ── Banner ──────────────────────────────────────────────────────────── */
    .banner {
      position: relative;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
      background: var(--bg-2);
      border: 1px solid rgba(21,116,196,0.22);
      border-radius: 10px;
      padding: 10px 12px 10px 18px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .banner-accent {
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 3px; background: var(--blue);
    }
    .banner-body { display: flex; align-items: center; gap: 12px; }
    .banner-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 8px rgba(255,222,81,0.5);
      flex-shrink: 0;
    }
    .banner-title { font-weight: 600; font-size: 12.5px; color: var(--fg); letter-spacing: 0.02em; }
    .banner-sub   { font-size: 12px; color: var(--fg-muted); }
    .banner-actions { display: flex; align-items: center; gap: 6px; }

    .primary-btn {
      background: var(--blue);
      color: #fff;
      border: 0;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.04em;
      padding: 7px 12px;
      border-radius: 5px;
      cursor: pointer;
      transition: opacity 180ms ease;
    }
    .primary-btn.small { padding: 5px 10px; font-size: 11px; }
    .primary-btn:hover { opacity: 0.85; }

    .iconbtn {
      width: 24px; height: 24px;
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent;
      border: 1px solid transparent;
      color: var(--fg-muted);
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
      transition: background 180ms ease, color 180ms ease;
    }
    .iconbtn:hover { background: rgba(255,255,255,0.06); color: #fff; }

    /* ── Card grid ───────────────────────────────────────────────────────── */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .card {
      --accent: #1574C4;
      position: relative;
      background: var(--bg-1);
      border: 1px solid rgba(21,116,196,0.18);
      border-radius: 14px;
      padding: 0;
      display: flex; flex-direction: column;
      overflow: hidden;
      outline: none;
      transition: border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
      /* subtle inner top-light — gives the card a 3-D lifted feel */
      box-shadow:
        0 1px 0 rgba(170,206,232,0.06) inset,
        0 2px 8px rgba(0,0,0,0.25);
    }
    .card:hover {
      background: var(--bg-1h);
      border-color: color-mix(in oklch, var(--accent) 70%, transparent);
      box-shadow:
        0 1px 0 rgba(170,206,232,0.08) inset,
        0 4px 24px color-mix(in oklch, var(--accent) 22%, transparent),
        0 1px 6px rgba(0,0,0,0.3);
    }
    .card[data-status="stopped"] { opacity: 0.72; }
    .card[data-status="error"]   { border-color: rgba(242,92,92,0.40); }
    .card[data-focused="1"] {
      border-color: var(--accent);
      box-shadow:
        0 0 0 2px color-mix(in oklch, var(--accent) 35%, transparent),
        0 4px 24px color-mix(in oklch, var(--accent) 22%, transparent);
    }

    .card-accent {
      height: 3px; width: 100%;
      background: var(--accent);
    }
    .card-body { padding: 14px 14px 8px; flex-grow: 1; }
    .card-head { display: flex; gap: 12px; align-items: flex-start; }
    .card-title-wrap { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .card-title {
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 16px;
      color: var(--fg);
      letter-spacing: 0.005em;
      line-height: 1.15;
    }
    .card-desc {
      font-size: 12.5px;
      line-height: 1.4;
      color: var(--fg-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      display: flex; align-items: center; gap: 12px;
      margin-top: 10px;
      padding-left: 64px;
    }
    .port {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10.5px;
      color: var(--fg-dim);
      letter-spacing: 0.02em;
    }
    .shortcut {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 10px;
      letter-spacing: 0.04em;
      color: var(--fg-dim);
      padding: 2px 6px;
      background: var(--chip-bg, rgba(170,206,232,0.05));
      border: 1px solid var(--chip-bd, rgba(170,206,232,0.10));
      border-radius: 3px;
    }
    .card-rule {
      height: 1px;
      background: var(--rule-2);
      margin: 8px 14px 0;
    }
    .card-foot {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px 12px;
      gap: 8px;
    }
    .card-actions { display: flex; align-items: center; gap: 6px; }

    .ghost-btn {
      background: transparent;
      border: 1px solid var(--rule-2);
      color: var(--fg-muted);
      font-family: 'Inter', sans-serif;
      font-size: 11.5px;
      font-weight: 500;
      letter-spacing: 0.02em;
      padding: 5px 9px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 180ms ease, color 180ms ease, border-color 180ms ease;
    }
    .ghost-btn:hover { background: var(--chip-bg-h, rgba(170,206,232,0.08)); color: var(--fg); border-color: var(--chip-bd-h, rgba(170,206,232,0.25)); }
    .ghost-btn.warn { color: #F2A65C; border-color: rgba(242,166,92,0.35); }
    .ghost-btn.warn:hover { background: rgba(242,166,92,0.10); color: #FFB874; }

    .open-btn {
      background: var(--blue);
      color: #fff;
      border: 0;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.06em;
      padding: 6px 12px 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex; align-items: center;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .open-btn:hover:not(:disabled) { opacity: 0.85; }
    .open-btn:active:not(:disabled) { transform: translateY(1px); }
    .open-btn:disabled {
      opacity: 0.28;
      cursor: not-allowed;
    }

    /* ── Status dot pulse ────────────────────────────────────────────────── */
    @keyframes dotpulse {
      0%, 100% { opacity: 1;   transform: scale(1); }
      50%      { opacity: 0.35; transform: scale(0.88); }
    }
    .dot-pulse { animation: dotpulse 1.1s ease-in-out infinite; }

    /* ── Status bar ──────────────────────────────────────────────────────── */
    .statusbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px;
      background: var(--header-bg);
      border-top: 1px solid var(--hairline);
      font-size: 11px;
      color: var(--fg-dim);
      letter-spacing: 0.04em;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
    }
    .statusbar-left { display: flex; align-items: center; gap: 6px; }
    .sb-dot-wrap { display: inline-flex; align-items: center; padding: 0 2px; }
    .sb-summary { margin-left: 8px; color: var(--fg-muted); font-size: 11px; }
    .sb-host {
      color: var(--fg-dim);
      font-size: 10.5px;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.02em;
    }
    .sb-brand {
      color: var(--blue);
      font-size: 10px;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-transform: uppercase;
      opacity: 0.65;
    }

    /* ── Log panel ───────────────────────────────────────────────────────── */
    .logpanel {
      position: absolute;
      right: 16px; bottom: 48px;
      width: 480px;
      max-height: 280px;
      display: flex; flex-direction: column;
      background: rgba(4, 11, 22, 0.96);
      border: 1px solid rgba(21,116,196,0.30);
      border-radius: 8px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      overflow: hidden;
      z-index: 30;
    }
    .logpanel-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 10px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid rgba(170,206,232,0.08);
    }
    .logdot { width: 7px; height: 7px; border-radius: 50%; }
    .logtitle {
      font-family: 'Inter', sans-serif;
      font-size: 12px; font-weight: 600;
      color: #fff;
      letter-spacing: 0.02em;
    }
    .logsub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--fg-dim);
    }
    .logpanel-body {
      overflow: auto;
      padding: 8px 10px;
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 11px;
      line-height: 1.5;
    }
    .logpanel-body::-webkit-scrollbar { width: 8px; }
    .logpanel-body::-webkit-scrollbar-thumb { background: rgba(170,206,232,0.12); border-radius: 4px; }
    .logline {
      display: grid;
      grid-template-columns: 60px 32px 1fr;
      gap: 8px;
      padding: 1px 0;
      color: var(--fg-mono);
    }
    .logline.muted { color: var(--fg-dim); }
    .logline.info .loglvl { color: var(--fg-dim); }
    .logline.warn .loglvl { color: var(--yellow); }
    .logline.err  { color: #FFC0C0; }
    .logline.err  .loglvl { color: #F25C5C; }
    .logt   { color: var(--fg-dim); }
    .loglvl { letter-spacing: 0.08em; font-weight: 600; font-size: 10.5px; }

    /* ── Toast ───────────────────────────────────────────────────────────── */
    .toast {
      position: absolute;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      background: rgba(7, 32, 63, 0.96);
      border: 1px solid rgba(21,116,196,0.45);
      color: #EAF2FB;
      padding: 9px 14px;
      border-radius: 6px;
      font-size: 12.5px;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.01em;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 40;
      animation: toastIn 180ms ease;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translate(-50%, 8px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }

    /* If user has tweak panel open, push the log panel left to avoid overlap */
    body.has-tweaks .logpanel { right: 320px; }

    /* Make selection feel native to the brand */
    ::selection { background: rgba(21,116,196,0.35); color: #fff; }
  </style>
</head>
<body>
  <div id="root" class="desktop"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Tweaks helper, then logos, app icons, then the app -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="logo.jsx"></script>
  <script type="text/babel" src="app-icons.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>

  <script>
    // Track tweaks-panel open/closed for css adjustments
    window.addEventListener('message', (e) => {
      if (!e.data || typeof e.data.type !== 'string') return;
      if (e.data.type === '__activate_edit_mode')    document.body.classList.add('has-tweaks');
      if (e.data.type === '__deactivate_edit_mode')  document.body.classList.remove('has-tweaks');
    });

    // Fit the 960×680 stage to the viewport via transform: scale.
    function fitStage() {
      const stage = document.querySelector('.stage');
      if (!stage) return;
      const pad = 24;
      const sx = (window.innerWidth  - pad * 2) / 960;
      const sy = (window.innerHeight - pad * 2) / 680;
      const s = Math.min(1, Math.min(sx, sy));
      stage.style.transform = `scale(${s})`;
    }
    window.addEventListener('resize', fitStage);
    const fitObs = new MutationObserver(fitStage);
    fitObs.observe(document.getElementById('root'), { childList: true, subtree: true });
    requestAnimationFrame(fitStage);
    setTimeout(fitStage, 200);
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SDC Centralized Calendar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/design-system/tokens.css" />
  <link rel="icon" href="icons/sdc-calendar-icon-C.ico" type="image/x-icon" />
  <link rel="stylesheet" href="styles.css?v=13" />

  <script src="react.js"></script>
  <script src="react-dom.js"></script>
  <script src="babel.min.js"></script>
  <script src="xlsx.full.min.js"></script>
</head>
<body>
  <div id="pre-loader" style="position:fixed;inset:0;background:#0A1628;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:9999">
    <img src="assets/sdc-logo.png" style="height:60px;opacity:0.8" alt="SDC"/>
    <div style="width:200px;height:3px;background:rgba(255,255,255,0.1);border-radius:2px;overflow:hidden">
      <div style="height:100%;width:40%;background:#1574C4;border-radius:2px;animation:slide 1.2s ease-in-out infinite" id="pre-bar"></div>
    </div>
    <div style="color:rgba(255,255,255,0.4);font-family:Montserrat,sans-serif;font-size:13px">Loading calendar…</div>
    <style>#pre-bar{animation:slide 1.2s ease-in-out infinite}@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(550%)}}</style>
  </div>
  <div id="root"></div>


  <script src="utils.js"></script>
  <script src="data.js?v=13"></script>
  <script type="text/babel" data-presets="react" src="app.jsx?v=13"></script>
</body>
</html>
